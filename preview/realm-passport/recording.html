<!doctype html><html><body style="margin:0;background:#222"><video id="recording" controls style="width:100%;max-height:90vh" src="./animation-reference.mp4"></video><div style="display:flex;gap:15px" id="frames"></div><script>const video=document.querySelector('video');video.addEventListener('loadedmetadata',()=>{for(let time=0;time<video.duration;time+=1){const button=document.createElement('button');button.textContent=time+'s';button.onclick=()=>{video.pause();video.currentTime=time};document.querySelector('#frames').append(button)}})</script></body></html>
