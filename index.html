<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1b2f22" />
    <meta name="description" content="The Coffee Realm — thoughtfully brewed coffee, online ordering, and café operations." />
    <link rel="icon" type="image/png" href="/images/coffeerealmlogo.png" />
    <link rel="apple-touch-icon" href="/images/coffeerealmlogo.png" />
    <script>
      (() => {
        const stored = localStorage.getItem('coffee-realm-management-theme')
        const saved = ['system', 'light', 'dark'].includes(stored) ? stored : 'system'
        const theme = saved === 'system'
          ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : saved
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
      })()
    </script>
    <style>
      /* Critical first-paint colors. Keep the browser canvas dark before the
         application bundle and route-level styles have finished loading. */
      html[data-theme="dark"],
      html[data-theme="dark"] body,
      html[data-theme="dark"] #root {
        min-height:100%;
        background:#131413;
        color:#f0f1eb;
      }
      html[data-theme="dark"] body { margin:0; }
    </style>
    <title>The Coffee Realm</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
